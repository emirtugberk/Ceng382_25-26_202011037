<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Login</title>
    <style>
        body {
            background-image: url('https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExZmFvd2RlMTdjY3V2MmFid2h2ajlhOGNrbmp2czhjZnF0dHJjZXhlaCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/eIm624c8nnNbiG0V3g/giphy.gif'); 
            background-size: cover; 
            background-repeat: repeat; 
            background-position: top;
            margin: 0;
            color: #0f0;
            font-family: monospace;
        }
        
        .login-popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border: 2px solid #0f0;
            text-align: center;
            opacity: 0;
        }

        #clock {
            font-size: 18px;
            margin-bottom: 10px;
        }

        input {
            background: black;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 5px;
        }

        button {
            background: #0f0;
            color: black;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }

        #loginBtn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #0f0;
            color: black;
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Login Popup -->
    <div class="login-popup" id="loginPopup">
        <div id="clock"></div>
        <h2 id="loginTitle"></h2>
        <input type="text" id="username" placeholder="Kullanıcı Adı"><br><br>
        <input type="password" id="password" placeholder="Şifre"><br><br>
        <button onclick="login()">Giriş</button>
    </div>

    <!-- Login Button -->
    <button id="loginBtn" onclick="openLoginPopup()">Giriş Yap</button>

    <script>
        // Event listener for the "h" key to toggle the login popup
        document.addEventListener("keydown", function(event) {
            if (event.key === "h" || event.key === "H") {
                let popup = document.getElementById("loginPopup");
                if (popup.style.display === "block") {
                    popup.style.opacity = "0";
                    setTimeout(() => { popup.style.display = "none"; }, 500);
                } else {
                    popup.style.display = "block";
                    typeText("loginTitle", "Giriş Yap", 50);
                    typeText("username", "Kullanıcı Adı", 100);
                    typeText("password", "Şifre", 150);
                    setTimeout(() => { popup.style.opacity = "1"; }, 100);
                }
            }
        });

        // Function to simulate typing effect in text elements
        function typeText(elementId, text, delay) {
            let elem = document.getElementById(elementId);
            if (!elem) return;
            elem.placeholder = "";
            elem.innerHTML = "";
            let i = 0;
            function typing() {
                if (i < text.length) {
                    elem.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typing, delay);
                }
            }
            typing();
        }

        // Function to update the clock in the login popup
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // Function to open the login popup
        function openLoginPopup() {
            let popup = document.getElementById("loginPopup");
            popup.style.display = "block";
            typeText("loginTitle", "Giriş Yap", 50);
            typeText("username", "Kullanıcı Adı", 100);
            typeText("password", "Şifre", 150);
            setTimeout(() => { popup.style.opacity = "1"; }, 100);
        }

        // Function to handle login action
        function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Default credentials
            const correctUsername = "admin";
            const correctPassword = "admin";

            if (username === correctUsername && password === correctPassword) {
                // Redirect to table.html if credentials are correct
                window.location.href = "table.html";
            } else {
                alert("Geçersiz kullanıcı adı veya şifre.");
            }
        }
    </script>
</body>
</html>
