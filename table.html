<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Table</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #222;
            color: #0f0;
            text-align: center;
        }
        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px;
            border: 1px solid #0f0;
            text-align: center;
        }
        th {
            background-color: #333;
        }
        input, button {
            margin: 5px;
            padding: 10px;
            border: 1px solid #0f0;
            background: black;
            color: #0f0;
            cursor: pointer;
        }
        button:hover {
            background-color: #0f0;
            color: black;
        }
        .highlight {
            background-color: rgba(0, 255, 0, 0.3);
        }
    </style>
</head>
<body>

    <h1>Sınıf Bilgisi Ekle</h1>
    
    <form id="classForm">
        <input type="text" id="className" placeholder="Sınıf Adı" required>
        <input type="number" id="numPeople" placeholder="Kişi Sayısı" required>
        <input type="text" id="description" placeholder="Açıklama" required>
        <button type="submit">Ekle</button>
    </form>

    <h2>Eklenen Sınıflar</h2>
    <table id="classTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Sınıf Adı</th>
                <th>Kişi Sayısı</th>
                <th>Açıklama & İşlemler</th>
            </tr>
        </thead>
        <tbody>
            <!-- Dinamik olarak eklenecek satırlar -->
        </tbody>
    </table>

    <script>
        let classID = 1;

        // Form gönderildiğinde tabloya veri ekle
        document.getElementById("classForm").addEventListener("submit", function(event) {
            event.preventDefault();
            
            let className = document.getElementById("className").value;
            let numPeople = document.getElementById("numPeople").value;
            let description = document.getElementById("description").value;

            let table = document.getElementById("classTable").getElementsByTagName("tbody")[0];

            let newRow = table.insertRow();
            newRow.innerHTML = `
                <td>${classID}</td>
                <td>${className}</td>
                <td>${numPeople}</td>
                <td>
                    <span class="desc-text">${description}</span>
                    <button onclick="renameDescription(this)">Rename</button>
                    <button onclick="deleteRow(this)">Delete</button>
                </td>
            `;

            // Satıra click ve double-click eventleri ekle
            newRow.addEventListener("click", function() {
                this.classList.toggle("highlight");
            });

            newRow.addEventListener("dblclick", function() {
                alert('Seçilen sınıf: ${className}');
            });

            classID++;

            // Formu temizle
            document.getElementById("classForm").reset();
        });

        // Satır silme fonksiyonu
        function deleteRow(button) {
            button.parentElement.parentElement.remove();
        }

        // Açıklama güncelleme fonksiyonu
        function renameDescription(button) {
            let newDescription = prompt("Yeni açıklamayı girin:");
            if (newDescription) {
                button.parentElement.querySelector(".desc-text").textContent = newDescription;
            }
        }

        // Focus event ekleyerek input alanlarına efekt verelim
        document.querySelectorAll("input").forEach(input => {
            input.addEventListener("focus", function() {
                this.style.backgroundColor = "rgba(0, 255, 0, 0.2)";
            });
            input.addEventListener("blur", function() {
                this.style.backgroundColor = "black";
            });
        });
    </script>

</body>
</html>
